<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada — HSales</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo:#5B3FD9; --roxo-vibrante:#6B4DE6; --lavanda-suave:#EDE8FB;
    --branco:#FFFFFF; --quase-preto:#1A1A2E; --corpo:#585770; --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:32px;
    font-family:'Inter',system-ui,sans-serif; color:var(--quase-preto);
    background:linear-gradient(160deg,var(--lavanda-suave) 0%,var(--branco) 55%);
  }
  main{max-width:520px; text-align:center}
  .cod{font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--roxo)}
  h1{margin:12px 0 0; font-size:clamp(28px,5vw,40px); line-height:1.15; letter-spacing:-.02em}
  p{margin:16px 0 0; font-size:17px; line-height:1.6; color:var(--corpo)}
  .acoes{margin-top:32px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  a{
    display:inline-block; padding:14px 26px; border-radius:var(--radius);
    font-weight:600; font-size:15px; text-decoration:none; transition:transform .2s,box-shadow .2s;
  }
  .primaria{background:var(--roxo); color:var(--branco); box-shadow:0 12px 32px rgba(91,63,217,.24)}
  .primaria:hover{background:var(--roxo-vibrante); transform:translateY(-2px)}
  .secundaria{color:var(--roxo); border:1px solid rgba(91,63,217,.28)}
  .secundaria:hover{background:rgba(91,63,217,.06)}
  @media (prefers-color-scheme:dark){
    body{background:linear-gradient(160deg,#171730 0%,#101024 60%); color:#F4F2FF}
    p{color:#B8B4D6}
    .secundaria{color:#C4B5F4; border-color:rgba(196,181,244,.32)}
    .secundaria:hover{background:rgba(196,181,244,.10)}
  }
</style>
</head>
<body>
  <main>
    <div class="cod">Erro 404</div>
    <h1>Essa página não existe</h1>
    <p>O endereço pode ter mudado de lugar ou o link veio quebrado. A recepção continua aberta na página inicial.</p>
    <div class="acoes">
      <a class="primaria" href="/">Voltar para o início</a>
      <a class="secundaria" href="/suporte/">Falar com o suporte</a>
    </div>
  </main>
</body>
</html>
